<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#060406"/>
    </linearGradient>
    <filter id="glo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- gold core -->
  <g transform="translate(220,180)">
    <circle r="96" fill="#231f14"/>
    <circle r="58" fill="#0a0a0a"/>
    <circle r="22" fill="#d4af37" filter="url(#glo)"/>
  </g>

  <!-- hacker hex rotate -->
  <g transform="translate(780,180)">
    <g id="hex">
      <polygon points="-72,0 -36,-62 36,-62 72,0 36,62 -36,62" fill="none" stroke="#d4af37" stroke-width="2"/>
      <polygon points="-42,0 -21,-36 21,-36 42,0 21,36 -21,36" fill="none" stroke="#b2953f" stroke-width="1.25"/>
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#0b0b0b" stroke="#3b3016"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- glass card -->
  <g transform="translate(420,68)">
    <rect x="0" y="0" width="620" height="220" rx="16" fill="#070707" stroke="#2b2412"/>
    <text x="28" y="52" fill="#e6d7a3" font-family="Segoe UI, Arial" font-size="28" font-weight="700">Deepak Pandey</text>
    <text x="28" y="92" fill="#b9ad82" font-family="Segoe UI, Arial" font-size="16">Systems Developer • Kernel & Browser Internals</text>
    <text x="28" y="132" fill="#bcb09a" font-family="Segoe UI, Arial" font-size="13">Designing reliable, fast systems — focused on kernels, memory, and low-level performance.</text>
    <rect x="28" y="150" width="160" height="30" rx="14" fill="#d4af37" opacity="0.09"/>
    <text x="44" y="171" fill="#d4af37" font-family="Segoe UI, Arial" font-size="12" letter-spacing="1">CINEMATIC BLACK & GOLD</text>
  </g>
</svg>
