<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deepak Pandey — Kernel Demo</title>
  <style>
    :root{--bg:#040406;--gold:#d4af37;--muted:#a8a8a8}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#000 0%,#050509 100%);color:#ddd}
    canvas{display:block;width:100vw;height:100vh}
    .overlay{position:absolute;left:20px;bottom:20px;background:rgba(0,0,0,0.6);padding:12px 14px;border-radius:10px;border:1px solid rgba(212,175,55,0.12);backdrop-filter:blur(6px);}
    .boot{font-family:Source Code Pro,monospace;font-size:12px;color:#cfcfcf;max-width:520px;line-height:1.4}
    .boot .gold{color:var(--gold)}
    .tophud{position:absolute;left:22px;top:22px;background:rgba(0,0,0,0.5);padding:10px 12px;border-radius:8px;border:1px solid rgba(212,175,55,0.08)}
    a.btn{display:inline-block;margin-left:10px;padding:6px 10px;border-radius:8px;background:linear-gradient(90deg,rgba(212,175,55,0.16),rgba(212,175,55,0.06));border:1px solid rgba(212,175,55,0.18);color:var(--gold);text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <div class="tophud">
    <strong style="color:var(--gold)">Deepak Pandey</strong>
    <a class="btn" href="/deepak-pandey2005/resume.md" target="_blank">Resume</a>
  </div>
  <canvas id="c"></canvas>

  <div class="overlay boot" id="boot">
    <div><span class="gold">[kernel]</span> detecting devices... <span id="b1">OK</span></div>
    <div><span class="gold">[driver]</span> init: network (eth0) ... <span id="b2">OK</span></div>
    <div><span class="gold">[memory]</span> mapping physical memory ... <span id="b3">OK</span></div>
    <div style="margin-top:8px;color:#9aa0a6;font-size:12px">Tip: drag to rotate • scroll to zoom • press H to hide UI</div>
  </div>

  <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.150.1/examples/js/controls/OrbitControls.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setClearColor(0x000000,1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.06);

    const camera = new THREE.PerspectiveCamera(50,2,0.1,200);
    camera.position.set(0,0,9);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=0.7;controls.minDistance=4;controls.maxDistance=18;

    // lights
    const amb = new THREE.AmbientLight(0xffffff,0.25); scene.add(amb);
    const key = new THREE.PointLight(0xffd98e,2.6,40,2); key.position.set(4,4,6); scene.add(key);
    const fill = new THREE.PointLight(0x8a6a2f,1.2,30,2); fill.position.set(-4,-3,4); scene.add(fill);

    // core
    const coreGeo = new THREE.OctahedronGeometry(1.6,0);
    const coreMat = new THREE.MeshStandardMaterial({color:0x0a0a0a,metalness:0.9,roughness:0.15,emissive:0x2b2108,emissiveIntensity:0.45});
    const core = new THREE.Mesh(coreGeo,coreMat); scene.add(core);

    // subtle gold lines
    const wire = new THREE.LineSegments(new THREE.WireframeGeometry(coreGeo), new THREE.LineBasicMaterial({color:0xd4af37,transparent:true,opacity:0.9})); scene.add(wire);

    // orbiting shards
    const shardGeo = new THREE.BoxGeometry(0.18,0.6,0.08);
    const shardMat = new THREE.MeshStandardMaterial({color:0x1a1a1a,metalness:0.8,roughness:0.2,emissive:0x3a2c0c,emissiveIntensity:0.8});
    const shards = new THREE.Group(); scene.add(shards);
    for(let i=0;i<12;i++){
      const s=new THREE.Mesh(shardGeo,shardMat);
      const a=(i/12)*Math.PI*2; const r=3.0+Math.random()*1.2;
      s.position.set(Math.cos(a)*r,(Math.random()-0.5)*0.6,Math.sin(a)*r);
      s.rotation.set(Math.random()*2,Math.random()*2,Math.random()*2);
      shards.add(s);
    }

    // subtle particle field
    const pGeo=new THREE.BufferGeometry(); const cnt=900; const pos=new Float32Array(cnt*3);
    for(let i=0;i<cnt;i++){pos[i*3]=(Math.random()-0.5)*40; pos[i*3+1]=(Math.random()-0.5)*20; pos[i*3+2]=(Math.random()-0.5)*40}
    pGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xd4af37,opacity:0.06,size:0.06,transparent:true})); scene.add(particles);

    function resize(){const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
    window.addEventListener('resize',resize);resize();

    let t0=0; function animate(t){const time=t*0.001; core.rotation.y=time*0.4; core.rotation.x=time*0.25; wire.rotation.copy(core.rotation); shards.rotation.y=time*0.6; particles.rotation.y=time*0.03; controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate)}
    requestAnimationFrame(animate);

    // boot text anim
    const b1=document.getElementById('b1'); const b2=document.getElementById('b2'); const b3=document.getElementById('b3');
    setTimeout(()=>b1.textContent='OK',400); setTimeout(()=>b2.textContent='OK',800); setTimeout(()=>b3.textContent='OK',1200);

    // toggle UI
    let hud=true; window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'){hud=!hud;document.getElementById('boot').style.display=hud?'block':'none';document.querySelector('.tophud').style.display=hud?'block':'none'}});
  </script>
</body>
</html>
