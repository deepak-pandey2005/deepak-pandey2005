<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-label="Deepak Pandey — Systems &amp; Low-Level Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#111824" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#79C0FF" />
      <stop offset="100%" stop-color="#3FB950" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="280" rx="14" fill="url(#bgGrad)" />
  <rect width="1200" height="280" rx="14" fill="url(#grid)" opacity="0.65" />
  <rect x="1" y="1" width="1198" height="278" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top accent bar -->
  <rect x="48" y="0" width="220" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Decorative memory/register blocks on right -->
  <g transform="translate(830, 46)" opacity="0.9">
    <rect x="0" y="0" width="320" height="188" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <!-- Window dots -->
    <circle cx="18" cy="18" r="4.5" fill="#FF5F56" />
    <circle cx="34" cy="18" r="4.5" fill="#FFBD2E" />
    <circle cx="50" cy="18" r="4.5" fill="#27C93F" />
    <text x="298" y="22" text-anchor="end" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">ring0 :: x86_64</text>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#30363D" stroke-width="1" />

    <text x="18" y="58" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">CR3</text>
    <text x="64" y="58" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">0x0000_0000_0010_0000</text>

    <text x="18" y="82" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">RSP</text>
    <text x="64" y="82" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">0xFFFF_8000_0008_F000</text>

    <text x="18" y="106" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">RIP</text>
    <text x="64" y="106" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">kernel_main+0x0042</text>

    <line x1="18" y1="124" x2="302" y2="124" stroke="#21262D" stroke-width="1" />

    <text x="18" y="148" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">$ ./boot --arch=x86_64 --smp</text>
    <text x="18" y="170" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">[OK] Paging, APIC, Drivers ready</text>
  </g>

  <!-- Left Hero Content -->
  <g transform="translate(56, 56)">
    <!-- Status pill -->
    <rect x="0" y="0" width="248" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">BARE-METAL · KERNEL · SYSTEMS</text>

    <!-- Name -->
    <text x="0" y="84" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">Deepak Pandey</text>

    <!-- Subtitle -->
    <text x="2" y="120" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600">Systems &amp; Low-Level Software Engineer</text>

    <!-- Tagline -->
    <text x="2" y="154" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Engineering bare-metal OS kernels, Linux device drivers, zero-copy datapaths &amp; storage engines.</text>
  </g>
</svg>
